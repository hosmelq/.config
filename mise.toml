[bootstrap.macos.dock]
autohide = true
autohide_delay = 8640000.0
mru_spaces = false
orientation = "left"

[bootstrap.macos.finder]
preferred_view_style = "column"

[bootstrap.macos.keyboard]
fn_state = true
press_and_hold = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
AppleInterfaceStyleSwitchesAutomatically = true
AppleMenuBarVisibleInFullscreen = true
AppleMiniaturizeOnDoubleClick = false
AppleShowAllExtensions = true
AppleSpacesSwitchOnActivate = false
NSAllowContinuousSpellChecking = false
"com.apple.trackpad.forceClick" = false

[bootstrap.macos.defaults."com.apple.dock"]
"minimize-to-application" = true
tilesize = 60.0

[bootstrap.macos.defaults."com.sindresorhus.Supercharge-setapp"]
accidentalCloseWindowPreventionFilter = '{"apps":[],"isExclusion":false}'
accidentalCloseWindowPreventionMode = "disabled"
accidentalQuitPreventionMode = "doubleTap"
accidentalWindowClosingFilter = '{"apps":[],"isExclusion":false}'
automaticClipboardClear = true
brightnessAdjustmentStep = "half"
capsLockNoDelay = true
centerMousePointerTweak = true
defaultBrowserPickerUseSubmenu = false
disableAppSwitcher = true
finderCutFiles = true
finderCutFiles_soundEffects = true
finderOpenWithReturnKey = true
greenTrafficLightButtonFillIsEnabled = true
hideCursorIdleTimeout = "[0,5000000000000000000]"
isDMGAppInstallerEnabled = true
keepAwake_includeScreen = true
lowercaseFileExtensionsInDownloadsDirectory = true
menuBarIcon = "bolt"
menuSectionOrder = ["actions", "apps", "defaultBrowser", "shortcuts", "systemSettings", "toggles"]
preventMusicLaunch = true
preventMusicLaunch_onlyMediaKey = true
soundMenuBarIconVisibility = "always"
shownInMenu = ["captureAndTranslate", "scanQRCode", "scanQRCodeFromPasteboard", "clearAllNotifications", "startCleaningMode", "startCatMode", "darkMode", "toggleNightShift", "toggleTrueTone", "toggleMuteSound", "toggleMuteMicrophone", "toggleIOSNotifications", "toggleAutoQuitApps"]
unminimizeWindowsOnAppActivationMode = "disabled"
volumeAdjustmentStep = "normal"

[bootstrap.macos.defaults."org.hammerspoon.Hammerspoon"]
MJShowMenuIconKey = false

[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
host = "current"
key = "com.apple.keyboard.modifiermapping.0-0-0"
value = [
  { HIDKeyboardModifierMappingDst = 30064771072, HIDKeyboardModifierMappingSrc = 30064771300 },
  { HIDKeyboardModifierMappingDst = 30064771072, HIDKeyboardModifierMappingSrc = 30064771296 },
  { HIDKeyboardModifierMappingDst = 30064771300, HIDKeyboardModifierMappingSrc = 30064771129 },
]

[dotfiles]
"~/.agents/.skill-lock.json" = { mode = "symlink", source = "dotfiles/agents/.skill-lock.json" }
"~/.codex/AGENTS.md" = { mode = "copy", source = "dotfiles/agents/AGENTS.md" }
"~/.codex/keybindings.json" = { mode = "symlink", source = "dotfiles/agents/codex-keybindings.json" }
"~/.claude/CLAUDE.md" = { mode = "symlink", source = "~/.codex/AGENTS.md" }
"~/.composer/composer.json" = { mode = "symlink", source = "dotfiles/composer/composer.json" }
"~/.config/fish" = { mode = "symlink-each", source = "dotfiles/fish" }
"~/.config/git/config" = { mode = "symlink", source = "dotfiles/git/config" }
"~/.config/git/ignore" = { mode = "symlink", source = "dotfiles/git/ignore" }
"~/.config/mise/config.toml" = { mode = "symlink", source = "mise/config.toml" }
"~/.hammerspoon/init.lua" = { mode = "symlink", source = "dotfiles/hammerspoon/init.lua" }

[tools]
# Required for third-party taps before the global tool config is linked.
ruby = "latest"

[tasks.bootstrap]
description = "Install portable application packages"
run = "./scripts/bootstrap-apps.sh"
